replicaCount: 1

image:
  repository: ghcr.io/hadijeddizahed/springappk8s
  tag: sha-834379f
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: springapp.local
      paths:
        - path: /
          pathType: Prefix

config:
  greetingMessage: "Hello from Spring Boot running in Minikube via Helm ConfigMap!"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 20
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 5
