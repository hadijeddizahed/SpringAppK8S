name: Build, Test & Publish Container Image (CI)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'
      - 'argocd-application.yaml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: Test & Quality Gate
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn test

  # ==========================================
  # JOB 2: Build JAR Package
  # ==========================================
  build:
    name: Build Application Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR Package
        run: mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar
          retention-days: 1

  # ==========================================
  # JOB 3: Build & Publish Container Image -
  # ==========================================
  publish:
    name: Build & Push Container Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: target

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Helm Chart Image Tag (GitOps Automation)
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          NEW_TAG="sha-${SHORT_SHA}"
          echo "Updating Helm chart values.yaml to image tag: ${NEW_TAG}"

          # Update the tag in helm/spring-app/values.yaml
          sed -i "s/tag: .*/tag: ${NEW_TAG}/" helm/spring-app/values.yaml

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit and push back to main
          git add helm/spring-app/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update image tag to ${NEW_TAG} [skip ci]" && git push)
